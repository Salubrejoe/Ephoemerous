<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Sun POI badge — faithful to POILabelView: 5-corner squircle (bulge 5),
       vertical sun gradient (bodySunBottom #EBAD66 → bodySunTop #FAE08C),
       casing ring in the sky/systemBackground navy. Glyph group is optional
       (the on-canvas label has it commented out) — delete #sun-glyph for the
       bare badge. -->
  <defs>
    <linearGradient id="sunGrad" gradientUnits="objectBoundingBox"
                    x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#EBAD66"/>
      <stop offset="1" stop-color="#FAE08C"/>
    </linearGradient>
    <filter id="sunGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

